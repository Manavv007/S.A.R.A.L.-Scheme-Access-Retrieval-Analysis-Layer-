name: Sync to Hugging Face

# Deploys Streamlit UI to HF Spaces ONLY after CI succeeds on main.
# Re-enable this workflow in the GitHub Actions UI once FastAPI is hosted
# and Space secrets include SARAL_API_BASE_URL (or BACKEND_URL).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Push to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          # Drop history + heavy / irrelevant paths (Streamlit client only).
          rm -rf .git
          rm -rf data/raw_pdfs data/processed || true
          rm -rf .agents agent .kiro .project-brain web stitch scraper || true
          rm -rf .venv venv node_modules || true
          find . -name '*.sqlite' -delete || true
          find . -name '*.pdf' -delete || true

          # HF installs requirements.txt — use the slim Streamlit client deps.
          if [ -f requirements-spaces.txt ]; then
            cp requirements-spaces.txt requirements.txt
          fi

          # Streamlit Space does not run FastAPI; drop heavy backend packages.
          rm -rf backend || true

          git init
          git branch -M main
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add -A
          git commit -m "Automated deployment to Hugging Face (Streamlit client)"

          git push --force "https://Manavv007:${HF_TOKEN}@huggingface.co/spaces/Manavv007/S.A.R.A.L" main
