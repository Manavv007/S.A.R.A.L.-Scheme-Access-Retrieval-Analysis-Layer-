name: Sync to Hugging Face

# Deploys to HF Spaces ONLY after the CI workflow succeeds on main.
# (Gated via workflow_run so a failing test/build never deploys.)
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    # Skip unless the triggering CI run passed (workflow_dispatch has no
    # workflow_run payload, so allow it through explicitly).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true
      - name: Push to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Nuke the Git history to destroy the memory of the large file
          rm -rf .git
          
          # 2. Delete the raw PDFs from the runner so they aren't included
          rm -rf data/raw_pdfs/*.pdf
          
          # 3. Create a fresh, clean, 1-commit history
          git init
          git branch -M main
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .
          git commit -m "Automated deployment to Hugging Face (Clean History)"
          
          # 4. Force push this lightweight version to Hugging Face
          git push --force https://Manavv007:$HF_TOKEN@huggingface.co/spaces/Manavv007/S.A.R.A.L main
